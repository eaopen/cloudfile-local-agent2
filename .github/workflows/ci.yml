name: Rust Agent CI

# The repository root is the Cargo workspace, so there is no `agent22/`
# working directory or path prefix any more. Long-lived branch is `dev`.
on:
  push:
    branches: [dev, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Formatting and lints are gates, not advice: without them the local
      # toolchain and CI drift and style fixes land as review noise.
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test locked Rust workspace
        # Keep going after a failing crate: without this, one Windows failure
        # hides every other target and the platform gaps need repeated pushes.
        run: cargo test --workspace --locked --no-fail-fast
      - name: Test development extension packaging
        run: node --test scripts/prepare-extension.test.cjs
      - name: Test local task-centre UX and HTML/JS integration
        run: node --test crates/cloudfile-desktop/tests/task-ux.test.cjs crates/cloudfile-desktop/tests/ui-contract.test.cjs
      - name: Test bootstrap digest gate
        run: node --test scripts/installer-guard.test.cjs
      - name: Windows bootstrap refuses an unverified network executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CLOUDFILE_INSTALL_SOURCE = 'http://127.0.0.1:1/agent2-updates'
          $env:CLOUDFILE_AGENT2_HOME = Join-Path $env:RUNNER_TEMP 'agent2-bootstrap-check'
          $env:CLOUDFILE_INSTALL_BOOTSTRAP_SHA256 = ''
          $env:CLOUDFILE_NO_PAUSE = '1'
          $first = Start-Process -FilePath $env:ComSpec -ArgumentList '/d', '/c', 'call .\scripts\install.cmd' -NoNewWindow -Wait -PassThru
          if ($first.ExitCode -eq 0) { throw 'Unverified bootstrap was incorrectly accepted' }
          if (Test-Path (Join-Path $env:CLOUDFILE_AGENT2_HOME 'cloudfile-install.exe')) {
            throw 'Bootstrap unexpectedly downloaded without a pinned digest'
          }
          New-Item -Path $env:CLOUDFILE_AGENT2_HOME -ItemType Directory -Force | Out-Null
          Set-Content -Path (Join-Path $env:CLOUDFILE_AGENT2_HOME 'cloudfile-install.exe') -Value 'not a trusted bootstrap'
          $env:CLOUDFILE_INSTALL_BOOTSTRAP_SHA256 = '0' * 64
          $logPath = Join-Path $env:RUNNER_TEMP 'agent2-bootstrap-mismatch.txt'
          $second = Start-Process -FilePath $env:ComSpec -ArgumentList '/d', '/c', 'call .\scripts\install.cmd' -NoNewWindow -Wait -PassThru -RedirectStandardOutput $logPath
          $output = Get-Content -Path $logPath -Raw
          if ($second.ExitCode -eq 0 -or -not ($output -match 'SHA-256 verification failed')) {
            throw 'A mismatched cached bootstrap was not rejected by digest verification'
          }
      - name: Package development build
        run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: cloudfile-agent2-${{ matrix.os }}
          path: dist/*.zip
          if-no-files-found: error
