name: Rust Agent CI

# The repository root is the Cargo workspace, so there is no `agent22/`
# working directory or path prefix any more. Long-lived branch is `dev`.
on:
  push:
    branches: [dev, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Linux 桌面和 Secret Service 使用系统库；与实际安装基线一致。
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Formatting and lints are gates, not advice: without them the local
      # toolchain and CI drift and style fixes land as review noise.
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test locked Rust workspace
        # Keep going after a failing crate: without this, one Windows failure
        # hides every other target and the platform gaps need repeated pushes.
        run: cargo test --workspace --locked --no-fail-fast
      - name: Test development extension packaging
        run: node --test scripts/prepare-extension.test.cjs
      - name: Test local task-centre UX and HTML/JS integration
        run: node --test crates/cloudfile-desktop/tests/task-ux.test.cjs crates/cloudfile-desktop/tests/ui-contract.test.cjs
      - name: Test bootstrap digest gate
        run: node --test scripts/installer-guard.test.cjs
      - name: Windows bootstrap refuses an unverified network executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CLOUDFILE_INSTALL_SOURCE = 'http://127.0.0.1:1/agent2-updates'
          $env:CLOUDFILE_AGENT2_HOME = Join-Path $env:RUNNER_TEMP 'agent2-bootstrap-check'
          $env:CLOUDFILE_INSTALL_BOOTSTRAP_SHA256 = ''
          $env:CLOUDFILE_NO_PAUSE = '1'
          $first = Start-Process -FilePath $env:ComSpec -ArgumentList '/d', '/c', 'call .\scripts\install.cmd' -NoNewWindow -Wait -PassThru
          if ($first.ExitCode -eq 0) { throw 'Unverified bootstrap was incorrectly accepted' }
          if (Test-Path (Join-Path $env:CLOUDFILE_AGENT2_HOME 'cloudfile-install.exe')) {
            throw 'Bootstrap unexpectedly downloaded without a pinned digest'
          }
          New-Item -Path $env:CLOUDFILE_AGENT2_HOME -ItemType Directory -Force | Out-Null
          Set-Content -Path (Join-Path $env:CLOUDFILE_AGENT2_HOME 'cloudfile-install.exe') -Value 'not a trusted bootstrap'
          $env:CLOUDFILE_INSTALL_BOOTSTRAP_SHA256 = '0' * 64
          $logPath = Join-Path $env:RUNNER_TEMP 'agent2-bootstrap-mismatch.txt'
          $second = Start-Process -FilePath $env:ComSpec -ArgumentList '/d', '/c', 'call .\scripts\install.cmd' -NoNewWindow -Wait -PassThru -RedirectStandardOutput $logPath
          $output = Get-Content -Path $logPath -Raw
          # Since 37b0f31 a stale *cache* is no longer a hard stop: it is deleted and
          # re-fetched against the same pinned digest (still byte-for-byte verified),
          # because the cached exe always predates the current channel. What must hold
          # here is that the mismatched file is never executed and the run fails closed
          # when no verified bytes can be obtained.
          if ($second.ExitCode -eq 0) {
            throw 'A mismatched cached bootstrap was incorrectly accepted'
          }
          if (-not ($output -match '\[WARN\]')) {
            throw 'A mismatched cached bootstrap was not retried against the pinned digest'
          }
          if (-not ($output -match '\[ERROR\]')) {
            throw 'A failed bootstrap re-download did not fail closed'
          }
          if (Test-Path (Join-Path $env:CLOUDFILE_AGENT2_HOME 'cloudfile-install.exe')) {
            throw 'An unverified cached bootstrap was left behind'
          }
          # A bootstrap shipped next to the script is the release artifact itself:
          # a digest mismatch there is a hard rejection, never a re-download.
          $bundle = Join-Path (Join-Path $PWD 'scripts') 'cloudfile-install.exe'
          Set-Content -Path $bundle -Value 'not a trusted bootstrap'
          try {
            $bundleLog = Join-Path $env:RUNNER_TEMP 'agent2-bootstrap-bundle.txt'
            $third = Start-Process -FilePath $env:ComSpec -ArgumentList '/d', '/c', 'call .\scripts\install.cmd' -NoNewWindow -Wait -PassThru -RedirectStandardOutput $bundleLog
            $bundleOutput = Get-Content -Path $bundleLog -Raw
            if ($third.ExitCode -eq 0 -or -not ($bundleOutput -match 'SHA-256 verification failed')) {
              throw 'A mismatched bundle bootstrap was not rejected by digest verification'
            }
          } finally {
            Remove-Item -LiteralPath $bundle -Force -ErrorAction SilentlyContinue
          }
      - name: Package development build
        run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: cloudfile-agent2-${{ matrix.os }}
          path: dist/*.zip
          if-no-files-found: error
